<html>
<head>
    <script crossorigin src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="basis-theory.js"></script>
    <script src="apple-demo-script.js"></script>

    <style>
        /* Styling the form */
        form {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        /* Styling the buttons */
        button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px 0;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Styling the textarea fields */
        textarea {
            width: 100%;
            height: auto;
            margin: 10px 0;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: "Courier New", Courier, monospace;
            background-color: #ffffff;
        }

        /* Styling labels */
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #333;
        }

        /* Styling the messages */
        p {
            font-size: 14px;
            color: green;
            margin: 5px 0;
        }

        #applePayButton {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px; /* Adjust height based on the desired space allocated for the button */
            margin: 20px auto; /* Center on the page with margin */
        }
    </style>

</head>
<body>

<div id="applePayButton">
    <!-- ---------------------------------–---------------------------------–
    Apple Pay Button Customization.
    ---------------------------------–---------------------------------– -->
    <style>
        apple-pay-button {
            --apple-pay-button-width: 194px;
            --apple-pay-button-height: 64px;
            --apple-pay-button-border-radius: 13px;
            --apple-pay-button-padding: 0px 0px;
            --apple-pay-button-box-sizing: border-box;
        }
    </style>
    <apple-pay-button buttonstyle="black" type="plain" locale="en-US"></apple-pay-button>
    <!-- ---------------------------------–---------------------------------–
    / Apple Pay Button Customization.
    ---------------------------------–---------------------------------– -->

    <style>
        #controls-container {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }


        /* General badge styling */
        .badge {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border-radius: 12px;
            text-transform: uppercase;
            text-align: center;
            min-width: 100px;
            position: fixed;
            top: 10px; /* Offset from the top */
            right: 10px; /* Offset from the right */
            z-index: 1000; /* Ensures it floats above other content */
        }

        /* Badge for production */
        .badge.production {
            background-color: red;
        }

        /* Badge for development */
        .badge.dev {
            background-color: green;
        }

        /* Badge for local development */
        .badge.local {
            background-color: gray;
        }

        /* Switch container styles */
        .switch-container {
            display: flex;
            align-items: center; /* This ensures vertical centering */
            gap: 10px;
            margin-top: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 12px;
            flex-direction: row;
            justify-content: flex-end;
            line-height: 1; /* Helps with vertical alignment */
        }

        /* The switch - the box around the slider */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The slider */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Rounded sliders */
        .slider.round {
            border-radius: 34px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        /* Switch label styles */
        .switch-label {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

    </style>
    <div id="controls-container">
        <div class="badge production" id="badge-production" style="display: none;">Production</div>
        <div class="badge dev" id="badge-development" style="display: none;">Development</div>
        <div class="badge local" id="badge-local" style="display: none;">Local</div>
        <div class="switch-container">
            <span class="switch-label">/connections/sessions</span>
            <label class="switch">
                <input type="checkbox" id="connectionSessionSwitch">
                <span class="slider round"></span>
            </label>
        </div>
    </div>

</div>
<script>
    // Set up the onclick handler for the Apple Pay button
    document.querySelector('apple-pay-button')
        .addEventListener('click', onApplePayButtonClicked);
</script>

<form>
    <button id="copyBtn">Copy Apple Pay Token</button>
    <p id="copyMessage"></p>

    <label for="outcome">Apple Pay Token</label>
    <textarea id="outcome" rows="20" cols="120">

    </textarea>


    <button id="copyApplePayTokenBtn">Copy Apple Pay Token</button>
    <p id="copyApplePayTokenMessage"></p>
    <label for="apple-pay-token">Basis Theory Apple Pay Token</label>
    <textarea id="apple-pay-token" rows="20" cols="120">

    </textarea>


    <button id="copyTokenIntentBtn">Copy Token Intent</button>
    <p id="copyTokenIntentMessage"></p>
    <label for="token-intent">Basis Theory Token Intent</label>
    <textarea id="token-intent" rows="20" cols="120">

    </textarea>
</form>
<script>
    function setupCopyButton(copyButtonId, textareaId, messageId, successMessage, errorMessage) {
        const copyButton = document.getElementById(copyButtonId);
        const textarea = document.getElementById(textareaId);
        const message = document.getElementById(messageId);

        copyButton.addEventListener("click", (event) => {
            event.preventDefault();
            navigator.clipboard.writeText(textarea.value)
                .then(() => {
                    message.textContent = successMessage;
                })
                .catch((err) => {
                    console.error("Failed to copy: ", err);
                    message.textContent = errorMessage;
                });
        });
    }

    setupCopyButton("copyBtn", "outcome", "copyMessage", "Apple Pay token copied to clipboard", "Failed to copy Apple Pay token");
    setupCopyButton("copyTokenIntentBtn", "token-intent", "copyTokenIntentMessage", "Token Intent copied to clipboard", "Failed to copy Token Intent");
    setupCopyButton("copyApplePayTokenBtn", "apple-pay-token", "copyApplePayTokenMessage", "Apple Pay Token copied to clipboard", "Failed to copy Apple Pay Token");
    initialize();
</script>
</body>
</html>
